name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sanitize
        run: bash tests/sanitize.sh
      - name: Unit tests
        run: python -m unittest discover -s tests -v -b
      - name: CLI help
        run: python cli/grokbot_usage.py --help
